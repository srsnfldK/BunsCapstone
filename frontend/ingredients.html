
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BunsCapstone - Ingredients</title>
    <link rel="stylesheet" href="/style.css">
    <script type="module" src="/app.js"></script>
</head>
<body>
    <header>
        <h1>Ingredient Inventory</h1>
        <nav>
            <a href="/">Home</a>
            <a href="/ingredients">Ingredients</a>
            <a href="#add-stock">Add Stock</a>
            <a href="#new-ingredient">New Ingredient</a>
        </nav>
    </header>

    <main>
        <h2>Ingredients</h2>

        <table id="ingredients-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Quantity</th>
                    <th>Unit</th>
                </tr>
            </thead>
            <tbody id="ingredients-body">
                <tr>
                    <td colspan="4">Loading ingredients...</td>
                </tr>
            </tbody>
        </table>

        <section id="add-stock">
            <h2>Add Stock:</h2>

            <form id="add-stock-form">
                <label for="stock-ingredient">Ingredient:</label>
                <select id="stock-ingredient" required>
                    <option value="">Select an ingredient:</option>
                </select>

                <!-- ADD EVENTUALLY (specify unit)-->

                <label for="stock-quantity">Quantity amount:</label>
                <input id="stock-quantity" type="number" min="0.01" step="0.01" required>

                <label for="stock-unit">Unit:</label>
                <select id="stock-unit" required>
                    <option value="" disabled selected>Unit</option>
                    <option value="g">Grams (g)</option>
                    <option value="kg">Kilograms (kg)</option>
                    <option value="oz">Ounces (oz)</option>
                    <option value="ct">Count (ct)</option>
                </select>


                <button type="submit">Submit</button>
            </form>
        </section>

        <section id="new-ingredient">
            <h2>New Ingredient:</h2>
            <form id="new-ingredient-form">
                <label for="new-ingredient-name">Name:</label>
                <input id="new-ingredient-name" type="text" required>

                <label for="new-stock-quantity">Quantity Amount:</label>
                <input id="new-stock-quantity" type="number" min="0" step="0.01" required>

                <label for="new-ingredient-unit">Unit:</label>

                <select id="new-ingredient-unit" required>
                    <option value="" disabled selected>Unit</option>
                    <option value="g">Grams (g)</option>
                    <option value="kg">Kilograms (kg)</option>
                    <option value="oz">Ounces (oz)</option>
                    <option value="ct">Count (ct)</option>
                </select>

                <button type="submit">Submit</button>
            </form>
            
            <p id="new-ingredient-message"></p>
        </section>

    </main>
</body>
</html>
