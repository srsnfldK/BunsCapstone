<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PantrySync - Recipe Stock Check</title>
    <link rel="stylesheet" href="/style.css">
    <script type="module" src="/recipes.js"></script>
</head>
<body>
    <header>
        <h1>PantrySync</h1>
        <nav>
            <a href="/">Home</a>
            <a href="/ingredients">Ingredients</a>
            <a href="/recipes">Recipes</a>
            <a href="/login.html" id="auth-link">Login</a>
        </nav>
    </header>

    <main>
        <h2>Recipe Stock Check</h2>
        <p id="auth-status">Checking login...</p>
        <p>Pick a recipe and how many batches you want to make to see if there is enough stock.</p>

        <form id="check-form" class="check-form">
            <label for="recipe-select">
                Recipe
                <select id="recipe-select" required>
                    <option value="">Loading recipes...</option>
                </select>
            </label>

            <label for="batches">
                Batches
                <input id="batches" type="number" min="0.5" step="0.5" value="1" required>
            </label>

            <button type="submit">Check stock</button>
        </form>

        <p id="result-message"></p>

        <table id="check-table" hidden>
            <thead>
                <tr>
                    <th>Ingredient</th>
                    <th>Needed</th>
                    <th>On hand</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="check-body"></tbody>
        </table>
    </main>
</body>
</html>
