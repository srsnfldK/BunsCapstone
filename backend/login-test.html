
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PantrySync Login Test</title>
</head>
<body>
  <h2>PantrySync Firebase Login Test</h2>

  <form id="loginForm">
    <input id="email" type="email" placeholder="Email" required>
    <input id="password" type="password" placeholder="Password" required>
    <button type="submit">Log In</button>
  </form>

  <button id="logoutButton" type="button">Log Out</button>
  <button id="ingredientsButton" type="button">
    View Ingredients
  </button>

  <pre id="result">Not logged in.</pre>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut
    } from
      "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

    // Correct PantrySync Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDMa6TXMIInBlf9w7HzI2Bc_sBMpj_bmp4",
      authDomain: "pantrysync-62d6b.firebaseapp.com",
      projectId: "pantrysync-62d6b",
      storageBucket: "pantrysync-62d6b.firebasestorage.app",
      messagingSenderId: "170861286787",
      appId: "1:170861286787:web:4fbd2e3f468a1817e8d2b6",
      measurementId: "G-XQL314QS46"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const result = document.getElementById("result");

    // Log in
    document.getElementById("loginForm")
      .addEventListener("submit", async (event) => {
        event.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        try {
          await signInWithEmailAndPassword(auth, email, password);
          result.textContent = "Login successful!";
        } catch (error) {
          result.textContent = "Login failed: " + error.code;
        }
      });

    // View protected ingredients
    document.getElementById("ingredientsButton")
      .addEventListener("click", async () => {
        const user = auth.currentUser;

        if (!user) {
          result.textContent = "Please log in first.";
          return;
        }

        try {
          const token = await user.getIdToken();

          const response = await fetch("/ingredients", {
            headers: {
              Authorization: "Bearer " + token
            }
          });

          const data = await response.json();

          result.textContent = JSON.stringify(data, null, 2);
        } catch (error) {
          result.textContent = "Request failed: " + error.message;
        }
      });

    // Log out
    document.getElementById("logoutButton")
      .addEventListener("click", async () => {
        try {
          await signOut(auth);
          result.textContent = "Logged out.";
        } catch (error) {
          result.textContent = "Logout failed: " + error.code;
        }
      });
  </script>
</body>
</html>
